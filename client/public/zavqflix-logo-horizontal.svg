<svg width="512" height="128" viewBox="0 0 512 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ZavqFlix — Cinematic Gradient Logo</title>
  <desc id="desc">Rounded diamond with a cut-out play triangle and ZavqFlix wordmark</desc>

  <defs>
    <linearGradient id="zf-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <filter id="zf-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.18"/>
    </filter>

    <mask id="zf-play-cut">
      <rect x="0" y="0" width="512" height="128" fill="white"/>
      <polygon points="56,44 56,84 88,64" fill="black"/>
    </mask>
  </defs>

  <g filter="url(#zf-soft)">
    <rect x="16" y="16" width="96" height="96" rx="22" ry="22"
          transform="rotate(45 64 64)"
          fill="url(#zf-grad)"
          mask="url(#zf-play-cut)"/>
  </g>

  <text x="136" y="86"
        font-family="Inter, Poppins, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Noto Sans', sans-serif"
        font-size="52" letter-spacing="0.5" fill="#0F172A" font-weight="800">
    Zavq<tspan font-weight="700" fill="url(#zf-grad)">Flix</tspan>
  </text>
</svg>
