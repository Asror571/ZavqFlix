<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t2 d2">
  <title id="t2">ZavqFlix Icon</title>
  <desc id="d2">Rounded diamond with play cut-out</desc>

  <defs>
    <linearGradient id="zf-grad-ico" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <mask id="zf-cut-ico">
      <rect width="120" height="120" fill="white"/>
      <polygon points="56,44 56,84 88,64" fill="black"/>
    </mask>
  </defs>

  <rect x="12" y="12" width="96" height="96" rx="22" ry="22"
        transform="rotate(45 60 60)"
        fill="url(#zf-grad-ico)"
        mask="url(#zf-cut-ico)"/>
</svg>
